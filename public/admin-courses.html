
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage courses | Chepkoilel DEB</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { align-items: flex-start; }
    .card { max-width: 720px; margin: 0 auto; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
    .field { width: 100%; box-sizing: border-box; padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; font-family: inherit; outline: none; margin-bottom: 12px; }
    .field:focus { border-color: var(--maroon); box-shadow: 0 0 0 3px rgba(128,0,0,.15); }
    textarea.field { min-height: 70px; resize: vertical; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row .btn { margin-top: 0; }
    h3 { margin: 24px 0 8px; color: var(--maroon-dark); }
    .course { border: 1px solid #eee; border-left: 4px solid var(--maroon); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
    .course b { color: var(--maroon-dark); }
    .course small { color: #666; display: block; margin-top: 4px; }
    .course .actions { display: flex; gap: 8px; margin-top: 10px; }
    .mini { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--maroon); background: #fff; color: var(--maroon); font-weight: bold; cursor: pointer; }
    .mini.danger { background: var(--maroon); color: #fff; }
    .empty { color: #666; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2v3.6c0 1.7 3.1 3.2 7 3.2s7-1.5 7-3.2v-3.6l-7 3.8-7-3.8z"/></svg>
      <h2>CHEPKOILEL DEB</h2>
      <p>Manage courses offered</p>
    </div>
    <div class="body">
      <label for="key" class="sr-only">Admin key</label>
      <input class="field" type="password" id="key" placeholder="Admin key" autocomplete="off">

      <h3 id="formTitle">Add a course</h3>
      <form id="courseForm" novalidate>
        <div class="row2">
          <input class="field" id="code" placeholder="Course code (e.g. CS101)" required>
          <input class="field" id="duration" placeholder="Duration (e.g. 2 years)">
        </div>
        <input class="field" id="name" placeholder="Course name" required>
        <textarea class="field" id="description" placeholder="Short description"></textarea>
        <div class="btn-row">
          <button class="btn btn-success" type="submit" id="saveBtn">Add course</button>
          <button class="btn btn-primary" type="button" id="cancelBtn" hidden>Cancel</button>
        </div>
        <p class="message" id="msg" role="status"></p>
      </form>

      <h3>Courses offered</h3>
      <div id="list"><p class="empty">Loading…</p></div>
    </div>
  </div>

<script src="admin-courses.js"></script>
</body>
</html>
