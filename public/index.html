
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in | Chepkoilel DEB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="header"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2v3.6c0 1.7 3.1 3.2 7 3.2s7-1.5 7-3.2v-3.6l-7 3.8-7-3.8z"/></svg>
      <h2>CHEPKOILEL COMPREHENSIVE</h2>
      <p>Student Portal - Sign in to your account</p>
    </div>
    <div class="body">
      <div class="info"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg><span>Access your courses, results and more at Chepkoilel DEB.</span></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="user" class="sr-only">Email or Student ID</label>
          <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <input type="text" id="user" placeholder="Email or Student ID" autocomplete="username" required>
          </div>
        </div>
        <div class="form-group">
          <label for="pass" class="sr-only">Password</label>
          <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
            <input type="password" id="pass" placeholder="Password" autocomplete="current-password" required>
          </div>
        </div>
        <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
        <a class="link" href="reset.html">Forgot password?</a>
        <button class="btn btn-success" type="submit" id="submitBtn">Sign In</button>
        <a class="btn btn-primary" href="register.html">Create account</a>
        <p class="message" id="msg" role="status"></p>
      </form>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="login.js"></script>
</body>
</html>
