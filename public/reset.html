<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password | Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="header"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2v3.6c0 1.7 3.1 3.2 7 3.2s7-1.5 7-3.2v-3.6l-7 3.8-7-3.8z"/></svg>
      <h2>STUDENT PORTAL</h2>
      <p>Reset your password</p>
    </div>
    <div class="body">
      <form id="requestForm" novalidate>
        <div class="form-group">
          <label for="identifier" class="sr-only">Email or Student ID</label>
          <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
            <input type="text" id="identifier" placeholder="Email or Student ID" autocomplete="username" required>
          </div>
        </div>
        <button class="btn btn-success" type="submit" id="requestBtn">Send reset link</button>
      </form>
      <form id="resetForm" novalidate class="hidden" style="display:none">
        <div class="form-group">
          <label for="newPass" class="sr-only">New password</label>
          <div class="input-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
            <input type="password" id="newPass" placeholder="New password (8+ characters)" autocomplete="new-password" required>
          </div>
        </div>
        <button class="btn btn-success" type="submit" id="resetBtn">Set new password</button>
      </form>
      <a class="link" href="index.html">Back to sign in</a>
      <p class="message" id="msg" role="status"></p>
    </div>
  </div>
  <script src="common.js"></script>
  <script src="reset.js"></script>
</body>
</html>
